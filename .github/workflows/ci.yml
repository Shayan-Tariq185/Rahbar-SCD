name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML types-requests
          pip install -r api/requirements.txt -r api/requirements-dev.txt -r indexer/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check api indexer eval corpus scripts/tune_cache_threshold.py

      - name: Run Mypy Type Checker (API)
        run: |
          cd api && mypy --config-file pyproject.toml app

      - name: Run Mypy Type Checker (Indexer)
        run: |
          cd indexer && mypy --config-file pyproject.toml pipeline

  test:
    name: Offline Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt -r indexer/requirements.txt

      - name: Run API Tests with Coverage Gate (>= 60%)
        run: |
          cd api && pytest -v --cov=app --cov-fail-under=60 --cov-report=term-missing

      - name: Run Indexer Offline Tests
        run: |
          cd indexer && pytest -v

  manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kustomize and Kubeconform
        run: |
          mkdir -p ~/.local/bin
          # Install Kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 ~/.local/bin
          # Install Kubeconform
          KUBECONFORM_VERSION="v0.6.7"
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C ~/.local/bin kubeconform
          chmod +x ~/.local/bin/kustomize ~/.local/bin/kubeconform
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ~/.local/bin/kustomize version
          ~/.local/bin/kubeconform -v

      - name: Validate Production Overlay with Kubeconform
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -summary

      - name: Validate CI Overlay with Kubeconform
        run: |
          kustomize build k8s/overlays/ci | kubeconform -strict -ignore-missing-schemas -summary

      - name: Validate Dev Overlay with Kubeconform
        run: |
          kustomize build k8s/overlays/dev | kubeconform -strict -ignore-missing-schemas -summary

  build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          load: true
          tags: rahbar-api:${{ github.sha }},rahbar-api:ci

      - name: Build UI Image
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile
          push: false
          load: true
          tags: rahbar-ui:${{ github.sha }},rahbar-ui:ci

      - name: Build Indexer Image (with Fixture Corpus)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          build-args: |
            CORPUS_SRC=eval/fixtures
          push: false
          load: true
          tags: rahbar-indexer:${{ github.sha }},rahbar-indexer:ci

  scan:
    name: Vulnerability Scan (Trivy)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API for Scanning
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          load: true
          tags: rahbar-api:scan

      - name: Build UI for Scanning
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile
          load: true
          tags: rahbar-ui:scan

      - name: Build Indexer for Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          build-args: |
            CORPUS_SRC=eval/fixtures
          load: true
          tags: rahbar-indexer:scan

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-api:scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore"

      - name: Scan UI Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-ui:scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore"

      - name: Scan Indexer Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-indexer:scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore"

  e2e-eval:
    name: End-to-End Evaluation on Kind
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Eval Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-ci
          wait: 120s

      - name: Build Images for Kind
        run: |
          docker build -t rahbar-api:ci api/
          docker build -t rahbar-ui:ci ui/
          docker build -t rahbar-indexer:ci --build-arg CORPUS_SRC=eval/fixtures -f indexer/Dockerfile .

      - name: Load Images into Kind Cluster
        run: |
          kind load docker-image rahbar-api:ci --name rahbar-ci
          kind load docker-image rahbar-ui:ci --name rahbar-ci
          kind load docker-image rahbar-indexer:ci --name rahbar-ci

      - name: Apply CI Overlay Manifests
        run: |
          kubectl apply -k k8s/overlays/ci

      - name: Wait for Chroma StatefulSet Rollout
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s

      - name: Wait for Indexer Job Completion
        run: |
          echo "Waiting for indexer batch job to complete..."
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=240s || {
            echo "Indexer job failed or timed out. Pod status:"
            kubectl get pods -n rahbar -l app=rahbar-indexer
            kubectl logs -n rahbar job/indexer --tail=100
            exit 1
          }

      - name: Wait for API Deployment Rollout
        run: |
          kubectl rollout status deploy/api -n rahbar --timeout=120s

      - name: Port-Forward API Service
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 5
          curl -sSf http://localhost:8000/healthz || {
            echo "API healthz failed"
            exit 1
          }

      - name: Run Golden Set Evaluation Runner
        run: |
          echo "Executing run_eval.py against port-forwarded API..."
          set +e
          python eval/run_eval.py \
            --api http://localhost:8000 \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.fixture.json \
            --out /tmp/results.json
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "All evaluation gates passed successfully!"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "::notice ::Evaluation runner exited with code 2 (Track B NotImplementedError: evaluation methods pending). API & retrieval plumbing verified successfully!"
          else
            echo "Evaluation failed with unexpected code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload Evaluation Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: /tmp/results.json
          if-no-files-found: ignore

      - name: Cluster Diagnostics on Failure
        if: failure()
        run: |
          echo "=== K8s Resources in Namespace rahbar ==="
          kubectl get all,pvc,configmap -n rahbar
          echo "=== Describe Pods ==="
          kubectl describe pods -n rahbar
          echo "=== Indexer Job Logs ==="
          kubectl logs -n rahbar job/indexer --tail=200 || true
          echo "=== API Pod Logs ==="
          kubectl logs -n rahbar -l app=rahbar-api --tail=200 || true
          echo "=== Chroma Pod Logs ==="
          kubectl logs -n rahbar -l app=rahbar-chroma --tail=200 || true

