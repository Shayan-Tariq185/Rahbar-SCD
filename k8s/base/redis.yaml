apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
  namespace: rahbar
  labels:
    app: rahbar-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rahbar
  labels:
    app: rahbar-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rahbar-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rahbar-redis
    spec:
      serviceAccountName: redis-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: redis-storage
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: cache-data
        - name: tmp
          emptyDir: {}

