apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels:
    app: rahbar-indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: rahbar-indexer
    spec:
      restartPolicy: OnFailure
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args:
            - python
            - -m
            - pipeline.run
            - --dummy
          envFrom:
            - configMapRef:
                name: rahbar-config
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

