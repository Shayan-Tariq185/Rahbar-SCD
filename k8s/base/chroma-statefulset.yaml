apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app: rahbar-chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: rahbar-chroma
  template:
    metadata:
      labels:
        app: rahbar-chroma
    spec:
      serviceAccountName: chroma-sa
      automountServiceAccountToken: false
      # Disable Kubernetes legacy service links so k8s does not inject
      # CHROMA_PORT="tcp://..." which crashes Chroma's Rust config loader
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          imagePullPolicy: IfNotPresent
          env:
            - name: CHROMA_PORT
              value: "8000"
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: "/data"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem is false because chromadb/chroma writes runtime logs
            # and click/python internal state to /chroma unless wrapped. Safest compromise:
            # runAsNonRoot, unprivileged user 1000, fsGroup 1000, drop ALL capabilities.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: chroma-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

