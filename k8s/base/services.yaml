apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rahbar
  labels:
    app: rahbar-api
spec:
  type: ClusterIP
  selector:
    app: rahbar-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: rahbar
  labels:
    app: rahbar-ui
spec:
  type: ClusterIP
  selector:
    app: rahbar-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app: rahbar-chroma
spec:
  type: ClusterIP
  selector:
    app: rahbar-chroma
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rahbar
  labels:
    app: rahbar-redis
spec:
  type: ClusterIP
  selector:
    app: rahbar-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

