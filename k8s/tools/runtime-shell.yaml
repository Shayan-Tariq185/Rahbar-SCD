apiVersion: v1
kind: Pod
metadata:
  name: runtime-shell
  namespace: rahbar
  labels:
    app: rahbar-runtime-shell
spec:
  serviceAccountName: runtime-shell-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: shell
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - mkdir -p /datalake/inbox /datalake/raw /datalake/archive /datalake/quarantine /datalake/state /results /traces && sleep infinity
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      volumeMounts:
        - name: datalake
          mountPath: /datalake
        - name: results
          mountPath: /results
        - name: traces
          mountPath: /traces
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: datalake
      persistentVolumeClaim:
        claimName: rahbar-datalake-pvc
    - name: results
      persistentVolumeClaim:
        claimName: rahbar-results-pvc
    - name: traces
      persistentVolumeClaim:
        claimName: rahbar-traces-pvc
    - name: tmp
      emptyDir: {}
