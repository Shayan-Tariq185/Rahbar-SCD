apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app: rahbar-indexer
    ragops/writer: "true"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: rahbar-indexer
        ragops/writer: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: __ARGS__
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: RAGOPS_EXTRACT_TIMEOUT
              value: "600"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            # Provisional bootstrap values; update from F5 kubectl top measurements
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datalake
              mountPath: /datalake
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datalake
          persistentVolumeClaim:
            claimName: rahbar-datalake-pvc
        - name: results
          persistentVolumeClaim:
            claimName: rahbar-results-pvc
        - name: tmp
          emptyDir: {}
